<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DSA Galaxy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: a fixed star sky behind a scrolling mission. Hero, mission map, one planet zone per part of the notes.
   Study happens in a focus drawer that dims the sky. Single dark space look by choice. */
:root {
  --void: #050716;
  --deep: #0a1030;
  --panel: #10183f;
  --panel2: #18235c;
  --line: rgba(160, 180, 255, .16);
  --text: #eaeeff;
  --muted: #a3aedb;
  --amber: #ffc857;
  --cyan: #4ee0d0;
  --violet: #9a86ff;
  --pink: #ff7eaa;
  --good: #5fe3a1;
  --bad: #ff6f81;
  --code-bg: #080d28;
  --f-disp: 'Chakra Petch', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --f-hand: 'Caveat', 'Segoe Script', cursive;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { background: var(--void); color: var(--text); font: 16px/1.6 var(--f-body); overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--void); }
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-disp); margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
code { font-family: var(--f-mono); font-size: .88em; background: rgba(120, 140, 255, .16); padding: 1px 6px; border-radius: 6px; }
mark { background: linear-gradient(transparent 55%, rgba(255, 200, 87, .38) 55%); color: inherit; padding: 0 2px; }
b, strong { color: var(--amber); font-weight: 600; }
#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#sky { z-index: 0; transition: opacity .5s; }
#fx { z-index: 90; }
body.focus #sky { opacity: .22; }
main, .hud, .foot { position: relative; z-index: 2; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r); }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(5, 7, 22, .78); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.hud-in { max-width: 1120px; margin: 0 auto; padding: 10px var(--gut-r) 10px var(--gut-l); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; font: 700 20px/1 var(--f-disp); letter-spacing: .02em; }
.brand svg { width: 28px; height: 28px; }
.xp { flex: 1 1 220px; min-width: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font: 600 13px var(--f-disp); color: var(--muted); }
.lvl { color: var(--amber); white-space: nowrap; }
.xpbar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), #ff9d4d); border-radius: 99px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.streak { white-space: nowrap; }
.hud-nav { display: flex; gap: 8px; }
.hud-nav button, .btn { border: 1px solid var(--line); background: rgba(255, 255, 255, .05); padding: 8px 14px; border-radius: 10px; font: 600 14px var(--f-disp); transition: background .2s, transform .2s, border-color .2s; }
.hud-nav button:hover, .btn:hover { background: rgba(255, 255, 255, .11); border-color: rgba(255, 255, 255, .35); }
.btn.pri { background: var(--amber); color: #1a1202; border-color: var(--amber); }
.btn.pri:hover { background: #ffd57a; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
@media (max-width: 640px) { .hud-nav button { padding: 7px 10px; font-size: 13px; } .brand span { display: none; } }

/* Hero */
.hero { position: relative; padding-block: 56px 36px; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 24px; align-items: center; }
.eyebrow { font: 600 13px var(--f-disp); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.hero h1 { font-size: clamp(44px, 8vw, 92px); letter-spacing: -.01em; margin: 10px 0 14px; }
.hero h1 em { font-style: normal; color: var(--amber); }
.hero p.lead { max-width: 52ch; font-size: 18px; color: var(--muted); }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 26px; }
.hero-cta .btn { padding: 12px 20px; font-size: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.stat b { display: block; font: 700 30px/1 var(--f-disp); color: var(--text); }
.stat span { font-size: 13px; color: var(--muted); }
.hero-art { position: relative; aspect-ratio: 1; max-width: 100%; }
@media (max-width: 820px) { .hero-grid { grid-template-columns: 1fr; } .hero-art { max-width: 320px; margin: 0 auto; } }

/* Planets */
.planet { --s: 200px; position: absolute; width: var(--s); aspect-ratio: 1; border-radius: 50%; will-change: transform;
  background: radial-gradient(circle at 30% 26%, var(--p1, #ffd36b), var(--p2, #e28a2e) 55%, var(--p3, #4a2208) 100%);
  box-shadow: inset -22px -26px 60px rgba(0, 0, 20, .7), 0 0 70px color-mix(in srgb, var(--p2, #e28a2e) 45%, transparent); }
.planet::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: repeating-linear-gradient(172deg, transparent 0 14%, rgba(255, 255, 255, .09) 14% 19%, transparent 19% 33%, rgba(0, 0, 0, .12) 33% 38%); mix-blend-mode: soft-light; }
.planet.ring::after { content: ""; position: absolute; left: -32%; right: -32%; top: 38%; bottom: 38%; border-radius: 50%; border: 5px solid color-mix(in srgb, var(--p1, #ffd36b) 70%, white); border-left-color: transparent; border-right-color: transparent; transform: rotate(-16deg); opacity: .8; }
.hero-art .planet { --s: 62%; left: 20%; top: 18%; animation: bob 9s ease-in-out infinite; }
.hero-art .moon { --s: 17%; left: 6%; top: 68%; --p1: #c9d4ff; --p2: #7886c9; --p3: #20284f; animation: bob 7s ease-in-out -2s infinite; }
.hero-art .moon.b { --s: 10%; left: 84%; top: 14%; --p1: #ffb0cc; --p2: #d9578b; --p3: #4a1230; animation-duration: 6s; }
.rocket { position: absolute; width: 22%; right: 6%; bottom: 8%; animation: fly 6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-12px); } }
@keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(8deg); } 50% { transform: translate(-14px, -18px) rotate(2deg); } }

/* Mission map */
.sec-h { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.sec-h h2 { font-size: clamp(28px, 4vw, 40px); }
.sec-h p { color: var(--muted); max-width: 52ch; }
.map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding-block: 8px 48px; }
.stop { text-align: left; background: rgba(16, 24, 63, .7); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; transition: transform .25s, border-color .25s; }
.stop:hover { transform: translateY(-4px); border-color: var(--c); }
.orb { --s: 38px; width: var(--s); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 30% 28%, var(--p1), var(--p2) 60%, var(--p3)); box-shadow: inset -6px -6px 14px rgba(0, 0, 20, .6), 0 0 18px color-mix(in srgb, var(--p2) 50%, transparent); flex: none; }
.stop h3 { font-size: 17px; }
.stop small { color: var(--muted); font-size: 13px; }
.mini { height: 5px; border-radius: 9px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--good); width: 0; transition: width .6s; }

/* Zones */
.zone { position: relative; padding-block: 64px; scroll-margin-top: 70px; overflow: hidden; }
.zone .planet { right: -90px; top: 20px; --s: 280px; opacity: .9; }
.zone:nth-of-type(even) .planet { right: auto; left: -110px; }
.zone-in { position: relative; z-index: 1; }
.zone-h { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.zone-h h2 { font-size: clamp(30px, 5vw, 52px); }
.pill { font: 600 12px var(--f-disp); letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.zone .blurb { color: var(--muted); font-size: 18px; margin-bottom: 26px; max-width: 46ch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.tc { position: relative; text-align: left; display: grid; gap: 12px; align-content: start; min-width: 0; padding: 18px; border-radius: 18px; background: linear-gradient(160deg, rgba(24, 35, 92, .85), rgba(11, 16, 48, .9)); border: 1px solid var(--line); transition: transform .25s, border-color .25s, box-shadow .25s; }
.tc:hover { transform: translateY(-5px); border-color: var(--c); box-shadow: 0 14px 40px rgba(0, 0, 0, .45); }
.tc h3 { font-size: 20px; padding-right: 54px; overflow-wrap: anywhere; }
.tc .row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 12px var(--f-mono); padding: 3px 8px; border-radius: 7px; background: rgba(255, 255, 255, .07); color: var(--muted); }
.chip.t { color: var(--cyan); }
.chip.s { color: var(--pink); }
.tc .go { font: 600 14px var(--f-disp); color: var(--c); }
.mk { position: absolute; top: 14px; right: 14px; min-width: 40px; height: 40px; padding: 0 6px; display: grid; place-items: center; border: 2px solid var(--amber); border-radius: 50%; color: var(--amber); font: 700 14px var(--f-disp); transform: rotate(-8deg); }
.star { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; display: none; place-items: center; border-radius: 50%; background: var(--good); color: #052414; font: 700 18px var(--f-disp); }
.tc.done .star { display: grid; }
.tc.done .mk { display: none; }
.tc.done { border-color: color-mix(in srgb, var(--good) 55%, transparent); }

/* Rail */
.rail { position: fixed; z-index: 40; right: max(14px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); height: min(60vh, 460px); width: 22px; display: none; }
@media (min-width: 1280px) { .rail { display: block; } }
.rail::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.rail button { position: absolute; left: 4px; width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 0; background: var(--c); opacity: .55; transform: translateY(-50%); transition: opacity .2s, transform .2s; }
.rail button:hover, .rail button.on { opacity: 1; transform: translateY(-50%) scale(1.5); }
.rail button span { position: absolute; right: 24px; top: 50%; transform: translateY(-50%); white-space: nowrap; font: 600 12px var(--f-disp); background: var(--panel); padding: 3px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .2s; }
.rail button:hover span { opacity: 1; }
.rail .ship { position: absolute; left: 0; width: 22px; transform: translateY(-50%) rotate(180deg); transition: top .15s linear; pointer-events: none; }

/* Footer CTA */
.cta { margin-block: 30px 40px; padding: 30px; border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(120deg, rgba(154, 134, 255, .18), rgba(78, 224, 208, .1)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; }
.cta h2 { font-size: clamp(24px, 3.4vw, 34px); margin-bottom: 6px; }
.cta p { color: var(--muted); }
.cta .acts { display: flex; flex-wrap: wrap; gap: 10px; }
@media (max-width: 760px) { .cta { grid-template-columns: 1fr; } }
.foot { padding-block: 10px 60px; color: var(--muted); font-size: 14px; }

/* Drawer */
.drawer { position: fixed; inset: 0; z-index: 70; display: flex; justify-content: center; background: rgba(3, 4, 14, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .25s; }
.drawer[hidden] { display: none !important; }
.sheet { width: min(1040px, 100%); height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, #0c1238, #080c26 60%); border-left: 1px solid var(--line); border-right: 1px solid var(--line); animation: slide .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes fade { from { opacity: 0; } }
@keyframes slide { from { transform: translateY(40px); opacity: 0; } }
.d-head { display: flex; align-items: center; gap: 14px; padding: calc(12px + env(safe-area-inset-top, 0px)) var(--gut-r) 12px var(--gut-l); border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: clamp(20px, 3vw, 28px); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.d-head .orb { --s: 34px; }
.ic { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); display: grid; place-items: center; font-size: 18px; padding: 0; flex: none; }
.ic:hover { background: rgba(255, 255, 255, .12); }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding: 8px var(--gut-r) 0 var(--gut-l); border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font: 600 15px var(--f-disp); color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab.on { color: var(--amber); border-bottom-color: var(--amber); }
.d-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px var(--gut-r) 40px var(--gut-l); }
.d-body > * { max-width: 860px; margin-inline: auto; }
.d-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px var(--gut-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gut-l); border-top: 1px solid var(--line); background: rgba(5, 7, 22, .8); }
.stack { display: grid; gap: 18px; }
.box { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: rgba(255, 255, 255, .03); }
.box h4 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); margin-bottom: 8px; }
.box.story { background: linear-gradient(135deg, rgba(154, 134, 255, .18), rgba(78, 224, 208, .08)); font-size: 18px; }
.box p + p { margin-top: 8px; }
.hand { font: 600 26px/1.25 var(--f-hand); color: var(--amber); border-left: 3px solid var(--amber); padding: 4px 0 4px 14px; }
.hand small { display: block; font: 600 12px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.warn { border-color: rgba(255, 200, 87, .4); background: rgba(255, 200, 87, .07); font-size: 15px; }
.diagram { font: 500 20px/1.4 var(--f-mono); background: var(--code-bg); border-radius: 12px; padding: 12px 18px; margin: 0; overflow-x: auto; }

/* Steps */
.walk { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: s; }
.walk li { counter-increment: s; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); opacity: .4; transition: opacity .35s, transform .35s, border-color .35s, background .35s; cursor: pointer; }
.walk li::before { content: counter(s); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 700 15px var(--f-disp); background: rgba(255, 255, 255, .1); }
.walk li.on { opacity: 1; }
.walk li.cur { border-color: var(--amber); background: rgba(255, 200, 87, .08); transform: translateX(6px); }
.walk li.cur::before { background: var(--amber); color: #1a1202; }
.walk.all li { opacity: 1; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Code */
.codewrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--code-bg); }
.codebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: rgba(255, 255, 255, .05); font: 600 13px var(--f-disp); color: var(--muted); }
.codebar .btn { padding: 4px 10px; font-size: 12px; }
pre.code { margin: 0; padding: 14px 0; overflow-x: auto; font: 14px/1.65 var(--f-mono); counter-reset: ln; tab-size: 2; }
pre.code .l { display: block; padding: 0 16px 0 52px; position: relative; white-space: pre; }
pre.code .l::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0; width: 38px; text-align: right; color: rgba(160, 180, 255, .38); }
pre.code .cm { color: #ff9aa8; }
pre.code .kw { color: var(--cyan); }
pre.code.cover { filter: blur(7px); cursor: pointer; user-select: none; }
.cx { display: flex; flex-wrap: wrap; gap: 12px; }
.cxi { flex: 1 1 200px; border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); }
.cxi small { display: block; font: 600 12px var(--f-disp); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cxi b { font: 700 24px var(--f-disp); color: var(--text); }

/* Visualizer */
.vz { display: grid; gap: 14px; }
.vz-in { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.vz-in input { flex: 1 1 200px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--code-bg); color: var(--text); font: 15px var(--f-mono); }
.stage { border: 1px solid var(--line); border-radius: 16px; padding: 18px; background: radial-gradient(120% 100% at 50% 0, rgba(154, 134, 255, .12), transparent 60%), var(--code-bg); display: grid; gap: 16px; min-height: 170px; overflow-x: auto; }
.vrow { display: flex; align-items: flex-start; gap: 12px; }
.vlab { flex: 0 0 74px; padding-top: 10px; font: 600 12px var(--f-disp); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.vcells { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 20px; min-width: 0; }
.cell { position: relative; min-width: 44px; height: 44px; padding: 0 8px; display: grid; place-items: center; border-radius: 10px; background: var(--panel2); border: 1px solid rgba(160, 180, 255, .25); font: 600 15px var(--f-mono); transition: background .3s, border-color .3s, transform .3s, opacity .3s; }
.cell .pt { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; font: 600 11px var(--f-disp); font-style: normal; color: var(--amber); white-space: nowrap; }
.k-hl { border-color: var(--amber); background: rgba(255, 200, 87, .22); transform: translateY(-4px) scale(1.06); }
.k-sel { border-color: var(--cyan); background: rgba(78, 224, 208, .2); }
.k-min { border-color: var(--pink); background: rgba(255, 126, 170, .22); }
.k-done { border-color: var(--good); background: rgba(95, 227, 161, .2); }
.k-bad { border-color: var(--bad); background: rgba(255, 111, 129, .25); }
.k-win { border-color: var(--violet); background: rgba(154, 134, 255, .28); }
.k-x { opacity: .35; text-decoration: line-through; }
.k-dim { background: rgba(255, 255, 255, .04); border-color: rgba(160, 180, 255, .12); }
.msg { min-height: 52px; padding: 12px 14px; border-radius: 12px; background: rgba(255, 255, 255, .05); border-left: 4px solid var(--amber); font-size: 15.5px; }
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.player input[type=range] { accent-color: var(--amber); }
.player .scrub { flex: 1 1 160px; min-width: 0; }
.cnt { font: 600 13px var(--f-mono); color: var(--muted); min-width: 64px; text-align: center; }
svg.gr { width: 100%; max-width: 480px; height: auto; margin: 0 auto; display: block; }
svg.gr .e { stroke: rgba(160, 180, 255, .4); stroke-width: 2.5; }
svg.gr .e.cur { stroke: var(--amber); stroke-width: 4; }
svg.gr .e.take, svg.gr .e.path { stroke: var(--good); stroke-width: 4.5; }
svg.gr .e.skip { stroke: var(--bad); stroke-dasharray: 5 5; opacity: .7; }
svg.gr .n { fill: var(--panel2); stroke: rgba(160, 180, 255, .5); stroke-width: 2; transition: fill .3s, stroke .3s; }
svg.gr .n.cur { fill: rgba(255, 200, 87, .4); stroke: var(--amber); }
svg.gr .n.vis { fill: rgba(78, 224, 208, .3); stroke: var(--cyan); }
svg.gr .n.done { fill: rgba(95, 227, 161, .35); stroke: var(--good); }
svg.gr text { fill: var(--text); font: 700 15px var(--f-disp); text-anchor: middle; dominant-baseline: central; }
svg.gr text.w { fill: var(--amber); font: 600 13px var(--f-mono); }
svg.gr text.sub { fill: var(--cyan); font: 600 12px var(--f-mono); }
.bars { display: grid; gap: 10px; }

<script>
const PARTS = [
{ id: 'basics', name: 'Basics', blurb: 'How to measure any code you write.', topics: [
 { title: 'Code & its Time / Space Complexity',
   idea: `Time complexity = how the number of steps grows when the input size <code>n</code> grows. Space complexity = how much <i>extra</i> memory the code needs.`,
   example: `Doubling <code>n</code> doubles the steps of a single loop (O(n)) but makes a loop-inside-loop 4 times slower (O(n²)).`,
   algoTitle: 'How to count',
   algo: [
     `Ignore constants and small terms: <code>3n + 5</code> becomes O(n).`,
     `Loops one after another: <mark>add</mark>. Loop inside a loop: <mark>multiply</mark>.`,
     `Counter doubles or halves each time (<code>i *= 2</code>): that is O(log n).`,
     `Recursion: (number of calls) × (work done in each call).`,
     `Space = extra arrays + recursion stack. The input itself is not counted.`
   ],
   codes: [{ label: 'Patterns to remember', src:
`// O(1): no loop
int x = a[0] + a[1];

// O(n): one loop
for (int i = 0; i < n; i++) sum += a[i];

// O(n^2): loop inside loop
for (int i = 0; i < n; i++)
  for (int j = 0; j < n; j++) cnt++;

// O(log n): i doubles every time
for (int i = 1; i < n; i *= 2) cnt++;

// O(n log n): n times a log n loop
for (int i = 0; i < n; i++)
  for (int j = 1; j < n; j *= 2) cnt++;

// O(2^n): recursion calling itself twice
int fib(int n) { return n < 2 ? n : fib(n-1) + fib(n-2); }

// Space O(n): new int[n]  or  recursion depth n` }],
   tip: `Small to big: O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)`,
   glance: false }
]},
{ id: 'math', name: 'Math & Bits', blurb: 'Primes, coprime numbers and number tricks.', topics: [
 { title: 'Simple Sieve (Sieve of Eratosthenes)',
   idea: `Find all prime numbers up to <code>n</code>. Instead of testing every number, cross out the multiples of each prime.`,
   example: `n = 20: cross 4 6 8 10... (of 2), then 9 12 15 18 (of 3). Left: 2 3 5 7 11 13 17 19.`,
   algo: [
     `Make a boolean array of size n+1. <code>true</code> will mean "not prime".`,
     `Take i = 2. If i is not crossed, it is prime.`,
     `Cross out i·i, i·i + i, i·i + 2i ... up to n.`,
     `Repeat for next i while <code>i·i ≤ n</code>.`,
     `Every number from 2 that is still not crossed is prime.`
   ],
   codes: [{ label: 'Java', src:
`boolean[] comp = new boolean[n + 1];   // true = composite
for (int i = 2; i * i <= n; i++)
  if (!comp[i])
    for (int j = i * i; j <= n; j += i)
      comp[j] = true;
// x is prime if x >= 2 and !comp[x]` }],
   time: 'O(n log log n)', space: 'O(n)',
   tip: `Start crossing from <mark>i·i</mark>. Smaller multiples were already crossed by smaller primes.` },

 { title: `Euler's Phi φ(n)`, marks: '5 properties + 5 functions',
   idea: `φ(n) = how many numbers from 1 to n are <mark>coprime</mark> with n (their gcd with n is 1).`,
   example: `φ(9) = 6 → 1 2 4 5 7 8.   φ(10) = 4 → 1 3 7 9.`,
   props: [
     `φ(1) = 1`,
     `p is prime → φ(p) = p − 1. &nbsp;(φ(7) = 6)`,
     `φ(pᵏ) = pᵏ − pᵏ⁻¹. &nbsp;(φ(8) = 8 − 4 = 4)`,
     `gcd(a, b) = 1 → φ(a·b) = φ(a)·φ(b). &nbsp;(φ(12) = φ(4)·φ(3) = 2·2 = 4)`,
     `Sum of φ(d) over all divisors d of n = n. &nbsp;(n = 6: 1 + 1 + 2 + 2 = 6)`
   ],
   algoTitle: 'Fast way',
   algo: [
     `Start with <code>result = n</code>.`,
     `For every prime factor p of n: <code>result = result − result / p</code>.`,
     `This is the formula φ(n) = n · (1 − 1/p₁) · (1 − 1/p₂) ...`
   ],
   codes: [{ label: '5 functions', src:
`int gcd(int a, int b) { return b == 0 ? a : gcd(b, a % b); }

int phi1(int n) {                    // brute force
  int c = 0;
  for (int i = 1; i <= n; i++) if (gcd(i, n) == 1) c++;
  return c;
}

int phi2(int n) {                    // formula, uses prime factors
  int r = n;
  for (int p = 2; p * p <= n; p++)
    if (n % p == 0) { while (n % p == 0) n /= p; r -= r / p; }
  if (n > 1) r -= r / n;             // one big prime factor left
  return r;
}

int[] phiAll(int N) {                // phi of 1..N together (sieve)
  int[] f = new int[N + 1];
  for (int i = 0; i <= N; i++) f[i] = i;
  for (int i = 2; i <= N; i++)
    if (f[i] == i)                   // i is prime
      for (int j = i; j <= N; j += i) f[j] -= f[j] / i;
  return f;
}

int divisorSum(int n) {              // property 5: answer equals n
  int s = 0;
  for (int d = 1; d <= n; d++) if (n % d == 0) s += phi2(d);
  return s;
}` }],
   timeText: `phi1 O(n log n) &nbsp; phi2 O(√n) &nbsp; phiAll O(n log log n)`, time: 'phi2: O(√n)', space: 'O(1)',
   tip: `φ(n) is even for every n &gt; 2.` },

 { title: 'Binary Palindrome',
   idea: `Write the number in binary. If the bits read the same from both sides, it is a binary palindrome.`,
   example: `9 = 1001 → yes. &nbsp; 5 = 101 → yes. &nbsp; 10 = 1010 → no.`,
   algo: [
     `rev = 0, t = n.`,
     `Take the last bit of t (<code>t &amp; 1</code>) and push it into rev (<code>rev = rev &lt;&lt; 1 | bit</code>).`,
     `Shift t right (<code>t &gt;&gt;= 1</code>). Repeat until t is 0.`,
     `n is a binary palindrome if <code>rev == n</code>.`
   ],
   codes: [{ label: 'Java', src:
`boolean binPal(int n) {
  int rev = 0, t = n;
  while (t > 0) {
    rev = (rev << 1) | (t & 1);   // push last bit of t
    t >>= 1;
  }
  return rev == n;
}` }],
   time: 'O(log n)', space: 'O(1)' },

 { title: 'Strobogrammatic Number',
   idea: `A number that looks the same when turned upside down (rotated 180°). Only these pairs work: <mark>0-0, 1-1, 8-8, 6-9, 9-6</mark>.`,
   example: `Yes: 69, 88, 101, 619, 609. &nbsp; No: 25, 68, 962.`,
   algo: [
     `Put i on the first digit and j on the last digit.`,
     `The pair (s[i], s[j]) must be one of 00, 11, 88, 69, 96. Otherwise answer is false.`,
     `Move inward: i++, j--. Stop when i &gt; j.`,
     `The middle digit pairs with itself, so it can only be 0, 1 or 8.`
   ],
   codes: [
     { label: 'Check a number', src:
`boolean isStrobo(String s) {
  int i = 0, j = s.length() - 1;
  while (i <= j) {
    if (!"00 11 88 69 96".contains("" + s.charAt(i) + s.charAt(j)))
      return false;
    i++; j--;
  }
  return true;
}` },
     { label: 'Generate all of length n  (call gen(n, n))', src:
`List<String> gen(int n, int m) {
  if (n == 0) return new ArrayList<>(List.of(""));
  if (n == 1) return new ArrayList<>(List.of("0", "1", "8"));
  List<String> res = new ArrayList<>();
  for (String s : gen(n - 2, m)) {
    if (n != m) res.add("0" + s + "0");   // no leading zero
    res.add("1" + s + "1");  res.add("8" + s + "8");
    res.add("6" + s + "9");  res.add("9" + s + "6");
  }
  return res;
}` }
   ],
   time: 'O(n) to check', space: 'O(1)',
   tip: `Generating: wrap every shorter answer with a valid pair on both sides.` }
]},
{ id: 'strings', name: 'Strings', blurb: 'Two pointers, sliding window and Manacher.', topics: [
 { title: 'Move Hyphen', marks: '12 marks',
   idea: `Move all <code>-</code> characters to the front of the string. The other characters must keep their order.`,
   example: `ab-c-d → --abcd`,
   algo: [
     `Make a char array c. Keep a write pointer j at the last index.`,
     `Scan i from right to left. If c[i] is not '-', copy it to c[j] and do j--.`,
     `After the scan, fill c[0..j] with '-'.`
   ],
   codes: [{ label: 'Java', src:
`String moveHyphen(String s) {
  char[] c = s.toCharArray();
  int j = c.length - 1;                 // write pointer
  for (int i = c.length - 1; i >= 0; i--)
    if (c[i] != '-') c[j--] = c[i];     // push normal chars to the back
  while (j >= 0) c[j--] = '-';          // fill the front with hyphens
  return new String(c);
}` }],
   time: 'O(n)', space: 'O(n)',
   note: `Note: this line in the photo was hard to read. I took it as "move hyphens to the front". For "to the end", scan left to right and fill hyphens at the back. Tell me if your question is different.` },

 { title: 'Weighted Substring', marks: '12 marks',
   idea: `Weight of a letter: a = 1, b = 2 ... z = 26. Weight of a substring = sum of its letters. Task: find the <mark>longest substring whose weight is at most K</mark>.`,
   example: `s = "abc", K = 3 → "ab" has weight 3, length 2. Answer 2.`,
   algo: [
     `Keep a window [l, r] and its weight sum.`,
     `Move r right and add the weight of s[r].`,
     `While sum &gt; K, remove s[l] from the window and do l++.`,
     `After each step, best = max(best, window length).`
   ],
   codes: [{ label: 'Java', src:
`int longest(String s, int K) {
  int l = 0, sum = 0, best = 0;
  for (int r = 0; r < s.length(); r++) {
    sum += s.charAt(r) - 'a' + 1;                // weight of letter
    while (sum > K) sum -= s.charAt(l++) - 'a' + 1;
    best = Math.max(best, r - l + 1);
  }
  return best;
}` }],
   time: 'O(n)', space: 'O(1)',
   tip: `Brute force checks every substring, O(n²). The window works because every weight is positive.`,
   note: `Note: this line was also hard to read. I assumed the common version (longest substring with weight at most K). Tell me if your question is different.` },

 { title: `Manacher's Algorithm`, marks: '12 marks',
   idea: `Finds the <mark>longest palindromic substring</mark> in O(n). The trick: a palindrome is mirror-like, so reuse the answer already found on the mirror side.`,
   example: `aba → #a#b#a#, and the centre at b has radius 3. Radius = palindrome length in the original string.`,
   algo: [
     `Put <code>#</code> between all characters. Now odd and even palindromes look the same.`,
     `p[i] = radius of the palindrome centred at i.`,
     `Remember C = centre and R = right edge of the palindrome that reaches farthest right.`,
     `If i &lt; R, start with <code>p[i] = min(R − i, p[2C − i])</code> (the mirror of i).`,
     `Then try to expand around i character by character.`,
     `If it passes R, update C = i and R = i + p[i].`,
     `Biggest p[i] is the answer. Start index = (centre − radius) / 2.`
   ],
   codes: [{ label: 'Java', src:
`String manacher(String s) {
  StringBuilder sb = new StringBuilder("#");
  for (char ch : s.toCharArray()) sb.append(ch).append('#');
  char[] t = sb.toString().toCharArray();
  int n = t.length, C = 0, R = 0, best = 0, mid = 0;
  int[] p = new int[n];
  for (int i = 0; i < n; i++) {
    if (i < R) p[i] = Math.min(R - i, p[2 * C - i]);   // use mirror
    while (i - p[i] - 1 >= 0 && i + p[i] + 1 < n
           && t[i - p[i] - 1] == t[i + p[i] + 1]) p[i]++;   // expand
    if (i + p[i] > R) { C = i; R = i + p[i]; }
    if (p[i] > best) { best = p[i]; mid = i; }
  }
  int start = (mid - best) / 2;
  return s.substring(start, start + best);
}` }],
   time: 'O(n)', space: 'O(n)',
   tip: `Brute force "expand around every centre" is O(n²). Manacher avoids repeating work.` }
]},
{ id: 'arrays', name: 'Arrays & Sorting', blurb: 'Sorting, rotating and 2D arrays.', topics: [
 { title: 'Selection Sort',
   idea: `Find the smallest element in the unsorted part and put it at the front. Repeat for the rest.`,
   example: `64 25 12 22 → 12 25 64 22 → 12 22 64 25 → 12 22 25 64`,
   algo: [
     `For i = 0 to n−2, assume a[i] is the minimum.`,
     `Scan j = i+1 to n−1. If a[j] is smaller, remember its index.`,
     `Swap a[i] with the minimum found.`
   ],
   codes: [{ label: 'Java', src:
`for (int i = 0; i < n - 1; i++) {
  int min = i;
  for (int j = i + 1; j < n; j++)
    if (a[j] < a[min]) min = j;
  int t = a[i]; a[i] = a[min]; a[min] = t;
}` }],
   time: 'O(n²) always', space: 'O(1)',
   tip: `Only n−1 swaps. Not stable.` },

 { title: 'Quick Sort',
   idea: `Pick a pivot. Put smaller elements on its left and bigger ones on its right. Then sort the left and right parts the same way.`,
   example: `10 80 30 90 40 50 70, pivot 70 → 10 30 40 50 | 70 | 90 80, then sort both sides.`,
   algo: [
     `If lo ≥ hi, stop (0 or 1 element).`,
     `Take the last element as pivot. Keep i = lo.`,
     `For j from lo to hi−1: if a[j] &lt; pivot, swap a[i] and a[j], then i++.`,
     `Swap a[i] with the pivot. The pivot is now at its final place.`,
     `Sort lo..i−1 and i+1..hi.`
   ],
   codes: [{ label: 'Java', src:
`void quick(int[] a, int lo, int hi) {
  if (lo >= hi) return;
  int p = a[hi], i = lo;                 // pivot = last element
  for (int j = lo; j < hi; j++)
    if (a[j] < p) { swap(a, i, j); i++; }
  swap(a, i, hi);                        // pivot to its place
  quick(a, lo, i - 1);
  quick(a, i + 1, hi);
}

 { title: 'Block Swap (Array Rotation)',

/* 1 Sieve */
function gSieve(n) {
  n = Math.max(10, Math.min(60, n | 0)); const comp = Array(n + 1).fill(false), fr = [];
  const row = (hl = -1, cur = -1) => ({ l: 'numbers', c: Array.from({ length: n - 1 }, (_, k) => { const v = k + 2; return C(v, v === cur ? 'hl' : comp[v] ? 'x' : v === hl ? 'sel' : ''); }) });
  fr.push(F([row()], 'Numbers 2 to ' + n + '. A crossed number is "not prime".'));
  for (let i = 2; i * i <= n; i++) {
    if (comp[i]) continue;
    fr.push(F([row(i)], i + ' is not crossed, so ' + i + ' is prime. Cross out ' + (i * i) + ', ' + (i * i + i) + ' ... up to ' + n + '.'));
    for (let j = i * i; j <= n; j += i) { fr.push(F([row(i, j)], 'Cross out ' + j + ' (a multiple of ' + i + ').')); comp[j] = true; }
  }
  const pr = []; for (let v = 2; v <= n; v++) if (!comp[v]) pr.push(v);
  fr.push(F([{ l: 'primes', c: pr.map(v => C(v, 'done')) }], 'Done. Every number that was never crossed is prime: ' + pr.join(', ') + '.'));
  return fr;
}

function gPhi(n) {
  n = Math.max(2, Math.min(40, n | 0)); const g = (a, b) => b ? g(b, a % b) : a, fr = [], st = {};
  const row = cur => ({ l: '1 to ' + n, c: Array.from({ length: n }, (_, k) => { const v = k + 1; return C(v, v === cur ? 'hl' : st[v] === 1 ? 'done' : st[v] === 2 ? 'x' : ''); }) });
  fr.push(F([row()], 'Check every number from 1 to ' + n + '. Green means gcd(i, ' + n + ') = 1 (coprime).'));
  let cnt = 0;
  for (let i = 1; i <= n; i++) {
    const d = g(i, n); fr.push(F([row(i)], 'gcd(' + i + ', ' + n + ') = ' + d + (d === 1 ? '. Coprime! Count = ' + (cnt + 1) + '.' : '. Not coprime.')));
    if (d === 1) { cnt++; st[i] = 1; } else st[i] = 2;
  }
  let m = n, r = n; const ps = []; for (let p = 2; p * p <= m; p++) if (m % p === 0) { ps.push(p); while (m % p === 0) m /= p; r -= r / p; } if (m > 1) { ps.push(m); r -= r / m; }
  fr.push(F([row()], 'φ(' + n + ') = ' + cnt + '. Formula check: ' + n + ' × ' + ps.map(p => '(1 − 1/' + p + ')').join(' × ') + ' = ' + r + '.'));

}

const KW = /\b(int|boolean|void|for|while|if|else|return|new|class|static|true|false|null|char|String|List|Stack|Queue|PriorityQueue|ArrayList|Math|Arrays)\b/g;
function hiCode(src) {
  return src.split('\n').map(l => { const i = l.indexOf('//'), code = i < 0 ? l : l.slice(0, i), cm = i < 0 ? '' : l.slice(i); return '<span class="l">' + (esc(code).replace(KW, '<span class="kw">$1</span>') || '') + (cm ? '<span class="cm">' + esc(cm) + '</span>' : '') + (l ? '' : '&#8203;') + '</span>'; }).join('');
}
function tabCode(h, T) {
  const t = T.t;
  h.onclick = null;
  h.innerHTML = '<div class="stack">' + t.codes.map((c, k) => '<div class="codewrap"><div class="codebar"><span>' + esc(c.label.replace(/\s+/g, ' ')) + '</span><span class="ctl"><button class="btn cv" type="button" data-k="' + k + '">Cover code</button><button class="btn cp" type="button" data-k="' + k + '">Copy</button></span></div><pre class="code" id="pc' + k + '">' + hiCode(c.src) + '</pre></div>').join('') +
    '<p class="hint">Tip: press Cover code, then try to write the program on paper. Click the blurred code to peek.</p>' +
    (t.time ? '<div class="cx"><div class="cxi"><small>Time</small><b>' + esc(t.time) + '</b></div><div class="cxi"><small>Space</small><b>' + esc(t.space) + '</b></div></div>' + (t.timeText ? '<p class="hint">' + t.timeText + '</p>' : '') : '') + '</div>';
  h.onclick = e => {
    const cv = e.target.closest('.cv'), cp = e.target.closest('.cp'), pre = e.target.closest('pre.code');
    if (cv) { const p = $('#pc' + cv.dataset.k), on = p.classList.toggle('cover'); cv.textContent = on ? 'Show code' : 'Cover code'; return; }
    if (pre && pre.classList.contains('cover')) { pre.classList.remove('cover'); const b = $('.cv[data-k="' + pre.id.slice(2) + '"]'); if (b) b.textContent = 'Cover code'; return; }
    if (cp) { const k = +cp.dataset.k, p = $('#pc' + k); const sel = () => { const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C to copy.'); };
      try { navigator.clipboard.writeText(t.codes[k].src).then(() => toast('Code copied'), sel); } catch (err) { sel(); } }
  };
}

/* ----- flashcards ----- */
function runDeck(host, cards) {
  if (!cards.length) { host.innerHTML = '<div class="box"><p>No cards in this set yet. Pick another filter.</p></div>'; return; }
  let list = cards.slice(), ix = 0, flip = false;
  host.innerHTML = '<div class="deck"><div class="deck-bar" aria-hidden="true"><i id="dbar"></i></div><button class="fc" type="button" id="fcc" aria-label="Flip card"><div class="fc-in"><div class="face f"><small>Question</small><div id="ff"></div></div><div class="face b"><small>Answer</small><div id="fb"></div></div></div></button><div class="hint" id="fm"></div><div class="deck-btns"><button class="btn" type="button" id="fp">Previous</button><button class="btn bad" type="button" id="fa">Again</button><button class="btn good" type="button" id="fk">Got it</button><button class="btn" type="button" id="fn">Next</button><button class="btn ghost" type="button" id="fs">Shuffle</button></div><p class="hint">Space flips the card. Arrow keys move. Press 1 for Again and 2 for Got it.</p></div>';
  const fcc = $('#fcc', host);
  function draw() {
    const c = list[ix], was = flip; flip = false; fcc.classList.remove('flip'); $('#ff', host).textContent = c.f; setTimeout(() => { const b = $('#fb', host); if (b) b.textContent = c.b; }, was ? 260 : 0);
    const st = S.fc[c.id]; $('#fm', host).textContent = 'Card ' + (ix + 1) + ' of ' + list.length + ' · ' + c.T.name + (st === 1 ? ' · known' : st === 0 ? ' · needs practice' : '');
    $('#dbar', host).style.width = (list.filter(x => S.fc[x.id] === 1).length / list.length * 100) + '%';
  }
  const go = d => { ix = (ix + d + list.length) % list.length; draw(); };
  const rate = v => { const c = list[ix]; if (v === 1 && S.fc[c.id] !== 1) addXP(2, true); S.fc[c.id] = v; save(); if (ix < list.length - 1) go(1); else draw(); };
  const flp = () => { flip = !flip; fcc.classList.toggle('flip', flip); };
  fcc.onclick = flp; $('#fp', host).onclick = () => go(-1); $('#fn', host).onclick = () => go(1); $('#fa', host).onclick = () => rate(0); $('#fk', host).onclick = () => rate(1);
  $('#fs', host).onclick = () => { list = shuf(list); ix = 0; draw(); };
  D.keys = e => { if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement !== fcc) return; e.preventDefault(); flp(); } else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); else if (e.key === '1') rate(0); else if (e.key === '2') rate(1); };
  draw();
}
function tabCards(h, T) { runDeck(h, cardsFor(T)); }

/* ----- quiz ----- */
function runQuiz(host, qs, o) {
  o = o || {}; let k = 0, locked = false, left = o.timer || 0, tmr = null; const res = [];
  host.innerHTML = (o.timer ? '<div class="timer" id="qt"></div>' : '') + '<div id="qbox"></div>';
  const box = $('#qbox', host), fmtT = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  if (o.timer) { const upd = () => { const q = $('#qt', host); if (q) { q.textContent = 'Time left ' + fmtT(left); q.classList.toggle('low', left <= 30); } }; upd(); tmr = setInterval(() => { left--; upd(); if (left <= 0) { clearInterval(tmr); finish(); } }, 1000); const prev = D.cleanup; D.cleanup = () => { clearInterval(tmr); if (prev) prev(); }; }
  function show() {
    const q = qs[k], opts = shuf([q.a].concat(q.w)); locked = false;
    box.innerHTML = '<div class="qhead"><span>Question ' + (k + 1) + ' of ' + qs.length + '</span><div class="bar"><i style="width:' + (k / qs.length * 100) + '%"></i></div></div><h3 class="qtext">' + esc(q.q) + '</h3><div class="opts">' + opts.map((t, i) => '<button class="opt" type="button" data-i="' + i + '"><b>' + 'ABCD'[i] + '</b><span>' + esc(t) + '</span></button>').join('') + '</div><div class="qfb" id="qfb"></div>';
    $$('.opt', box).forEach(b => b.onclick = () => {
      if (locked) return; locked = true; const ok = opts[+b.dataset.i] === q.a;
      $$('.opt', box).forEach(x => { x.disabled = true; if (opts[+x.dataset.i] === q.a) x.classList.add('ok'); }); if (!ok) b.classList.add('no');
      res.push({ q, picked: opts[+b.dataset.i], ok }); if (ok && !S.qdone[q.id]) { S.qdone[q.id] = 1; addXP(10, true); }
      $('#qfb', box).innerHTML = '<div class="box ' + (ok ? '' : 'warn') + '"><h4>' + (ok ? 'Correct' : 'Not quite') + '</h4><p>' + esc(q.e) + '</p></div><div class="ctl"><button class="btn pri" type="button" id="qn">' + (k + 1 < qs.length ? 'Next question →' : 'See results') + '</button></div>';
      $('#qn', box).onclick = () => { k++; if (k < qs.length) show(); else finish(); }; $('#qn', box).focus();
    });
  }
  function finish() {
    clearInterval(tmr); while (res.length < qs.length) res.push({ q: qs[res.length], picked: null, ok: false });
    const sc = res.filter(r => r.ok).length, pct = sc / qs.length; if (o.id) { S.qbest[o.id] = Math.max(S.qbest[o.id] || 0, sc); save(); }
    const wrong = res.filter(r => !r.ok), msg = pct === 1 ? 'Perfect run. You can mark this as mastered.' : pct >= .7 ? 'Strong. Read the review below to fix the rest.' : 'Good start. Open the review, then try again.';
    if (pct === 1) confetti();
    host.innerHTML = '<div class="score"><div class="big">' + sc + '/' + qs.length + '</div><p>' + msg + '</p><div class="ctl"><button class="btn pri" type="button" id="qr">' + (o.retryLabel || 'Try again') + '</button></div></div>' +
      (wrong.length ? '<h3 style="margin-bottom:12px">Review</h3><div class="rev">' + wrong.map(r => '<div class="box"><p class="q">' + esc(r.q.q) + '</p><p class="a">Answer: ' + esc(r.q.a) + '</p>' + (r.picked ? '<p class="p">You chose: ' + esc(r.picked) + '</p>' : '<p class="p">Not answered in time.</p>') + '<p class="hint">' + esc(r.q.e) + '</p>' + (o.links ? '<div class="ctl" style="margin-top:8px"><button class="btn" type="button" data-topic="' + r.q.T.i + '">Study ' + esc(r.q.T.name) + '</button></div>' : '') + '</div>').join('') + '</div>' : '');
    $('#qr', host).onclick = () => { if (o.retry) o.retry(); else runQuiz(host, shuf(qs), o); };
    if (o.onDone) o.onDone(sc, qs.length);
  }
  show();
}
function tabQuiz(h, T) {
  const qs = qsFor(T), best = S.qbest['t' + T.i];
  h.innerHTML = '<div class="stack"><div class="hint">' + qs.length + ' questions · each correct answer gives 10 XP the first time' + (best != null ? ' · best score ' + best + '/' + qs.length : '') + '</div><div id="qh"></div></div>';
  runQuiz($('#qh'), shuf(qs), { id: 't' + T.i });
}

/* ----- play: order the steps ----- */
function tabPlay(h, T) {
  const steps = T.t.algo; let next = 0, bad = 0;
  h.innerHTML = '<div class="stack"><div class="box"><h4>Order the steps</h4><p>Click the steps of <b>' + esc(T.name) + '</b> in the right order. Wrong clicks are counted but cost nothing.</p></div><div class="ordr" id="got"></div><div class="ordr" id="pool"></div><div class="msg" id="pm"></div></div>';
  const order = shuf(steps.map((s, i) => i)); let rem = order.slice();
  const draw = () => {
    $('#got').innerHTML = steps.slice(0, next).map((s, i) => '<div class="got"><b>' + (i + 1) + '</b><span>' + s + '</span></div>').join('');
    $('#pool').innerHTML = rem.map(i => '<button class="pick" type="button" data-i="' + i + '">' + steps[i] + '</button>').join('');
    $('#pm').textContent = next === steps.length ? (bad === 0 ? 'Perfect order with no mistakes.' : 'Done with ' + bad + ' wrong click' + (bad > 1 ? 's' : '') + '. Try again for a clean run.') : 'Step ' + (next + 1) + ' of ' + steps.length + '. Wrong clicks so far: ' + bad + '.';
    if (next === steps.length) { if (!S.ord[T.i]) { S.ord[T.i] = 1; save(); addXP(15); } confetti(); $('#pool').innerHTML = '<button class="btn pri" type="button" id="pagain">Play again</button>'; $('#pagain').onclick = () => tabPlay(h, T); }
  };
  $('#pool').onclick = e => {
    const b = e.target.closest('.pick'); if (!b) return; const i = +b.dataset.i;
    if (i === next) { rem = rem.filter(x => x !== i); next++; draw(); } else { bad++; b.classList.add('bad'); $('#pm').textContent = 'Not that one. Wrong clicks so far: ' + bad + '.'; setTimeout(() => b.classList.remove('bad'), 450); }
  };
  draw();
}

/* ----- global: flashcard arena ----- */
function openCards() {
  cleanup(); D.kind = 'cards'; openShell('Flashcard arena', null, [['all', 'Arena']]); setTabsOn('all'); $('#dfoot').innerHTML = '<span class="hint">Cards marked Again come back in the Needs practice filter.</span>';
  let flt = 'all';
  const body = $('#dbody');
  body.innerHTML = '<div class="stack"><div class="chips" id="fsc"></div><div id="fdeck"></div></div>';
  const filters = [['all', 'All cards'], ['new', 'Not seen'], ['hard', 'Needs practice']].concat(PARTS.map(p => [p.id, p.name]));
  const apply = () => {
    D.keys = null; $$('#fsc .chipb').forEach(b => b.classList.toggle('on', b.dataset.f === flt));
    const cs = ALLCARDS.filter(c => flt === 'all' ? true : flt === 'new' ? S.fc[c.id] === undefined : flt === 'hard' ? S.fc[c.id] === 0 : c.T.p.id === flt);
    runDeck($('#fdeck'), shuf(cs));
  };
  $('#fsc').innerHTML = filters.map(f => '<button class="chipb" type="button" data-f="' + f[0] + '">' + esc(f[1]) + '</button>').join('');
  $('#fsc').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { flt = b.dataset.f; apply(); } };
  apply();
}

/* ----- global: mock test ----- */
function openMock() {
  cleanup(); D.kind = 'mock'; openShell('Mock test', null, [['m', 'Timed test']]); setTabsOn('m'); $('#dfoot').innerHTML = '<span class="hint">Wrong answers show up in the review with a button to study that topic.</span>';
  const body = $('#dbody');
  function setup() {
    cleanup(); let cnt = 10, scope = 'all', timed = true;
    body.innerHTML = '<div class="stack"><div class="box"><h4>Build your test</h4><div class="stack"><div><p class="hint">Topics</p><div class="chips" id="msc"></div></div><div><p class="hint">Number of questions</p><div class="chips" id="mcn"></div></div><label class="field"><input type="checkbox" id="mtm" checked> <span>Timed (45 seconds per question)</span></label><div class="ctl"><button class="btn pri" type="button" id="mgo">Start test</button><span class="hint" id="mav"></span></div></div></div></div>';
    const scopes = [['all', 'Everything'], ['hi', 'High marks (8 and above)']].concat(PARTS.map(p => [p.id, p.name]));
    const pool = () => ALLQ.filter(q => scope === 'all' ? true : scope === 'hi' ? q.T.marks >= 8 : q.T.p.id === scope);
    const upd = () => { $$('#msc .chipb').forEach(b => b.classList.toggle('on', b.dataset.s === scope)); $$('#mcn .chipb').forEach(b => b.classList.toggle('on', +b.dataset.n === cnt)); $('#mav').textContent = pool().length + ' questions available'; };
    $('#msc').innerHTML = scopes.map(s => '<button class="chipb" type="button" data-s="' + s[0] + '">' + esc(s[1]) + '</button>').join('');
    $('#mcn').innerHTML = [5, 10, 20, 30].map(n => '<button class="chipb" type="button" data-n="' + n + '">' + n + '</button>').join('');
    $('#msc').onclick = e => { const b = e.target.closest('[data-s]'); if (b) { scope = b.dataset.s; upd(); } };
    $('#mcn').onclick = e => { const b = e.target.closest('[data-n]'); if (b) { cnt = +b.dataset.n; upd(); } };
    $('#mtm').onchange = e => { timed = e.target.checked; };
    $('#mgo').onclick = () => { const qs = shuf(pool()).slice(0, cnt); if (!qs.length) return; body.innerHTML = '<div id="mq"></div>'; runQuiz($('#mq'), qs, { timer: timed ? qs.length * 45 : 0, links: true, retry: setup, retryLabel: 'New test', id: 'mock' }); };
    upd();
  }
  setup();
}

/* ----- global: exam kit ----- */
function openKit(tab) {
  cleanup(); D.kind = 'kit'; openShell('Exam kit', null, [['marks', 'Marks map'], ['sheet', 'Cheat sheet'], ['plan', 'Revision planner']]); $('#dfoot').innerHTML = '<span class="hint">Tap any topic to open it.</span>';
  const body = $('#dbody');
  const tb = t => '<button class="chipb" type="button" data-topic="' + t.i + '">' + esc(t.name) + '</button>';
  const views = {
    marks() {
      const groups = [12, 10, 8, 5, 0]; const total = TOPICS.filter(t => t.marks >= 8).length;
      body.innerHTML = '<div class="stack"><div class="box warn"><h4>Where the marks are</h4><p>' + total + ' topics are worth 8 marks or more. Learn those first. For each one be ready to write the idea, the steps, the Java code and the time and space complexity.</p></div>' +
        groups.map(m => { const ts = TOPICS.filter(t => t.marks === m); if (!ts.length) return ''; return '<div class="box"><h4>' + (m ? m + ' marks · ' + ts.length + ' topics' : 'No marks noted · ' + ts.length + ' topics') + '</h4><div class="chips">' + ts.map(tb).join('') + '</div></div>'; }).join('') + '</div>';
    },
    sheet() {
      body.innerHTML = '<div class="stack"><div class="hand"><small>Growth ladder</small>O(1) &lt; O(log n) &lt; O(n) &lt; O(n log n) &lt; O(n²) &lt; O(2ⁿ) &lt; O(n!)</div><input class="search" id="csq" type="search" placeholder="Search a topic, like sort or graph" aria-label="Search the cheat sheet"><div class="tw"><table class="ct"><thead><tr><th>Topic</th><th>Time</th><th>Space</th><th>Marks</th><th>Remember</th></tr></thead><tbody id="cst"></tbody></table></div></div>';
      const draw = q => { $('#cst').innerHTML = TOPICS.filter(t => (t.name + ' ' + t.p.name + ' ' + strip(t.t.tip || '')).toLowerCase().includes(q)).map(t => '<tr class="link" data-topic="' + t.i + '"><td><b>' + esc(t.name) + '</b></td><td class="m">' + esc(t.t.time || '—') + '</td><td class="m">' + esc(t.t.space || '—') + '</td><td class="m">' + (t.marks || '') + '</td><td>' + esc(strip(t.t.tip || '')) + '</td></tr>').join('') || '<tr><td colspan="5">No topic matches.</td></tr>'; };
      $('#csq').oninput = e => draw(e.target.value.trim().toLowerCase()); draw('');
    },
    plan() {
      body.innerHTML = '<div class="stack"><div class="box"><h4>How many days until the exam?</h4><div class="field"><input id="pd" type="number" min="1" max="30" value="7" aria-label="Days until the exam"><button class="btn pri" type="button" id="pg">Make my plan</button></div><p class="hint">High-mark topics come first. The last day is for the mock test and the cheat sheet.</p></div><div class="plan" id="pout"></div></div>';
      const make = () => {
        const days = Math.max(1, Math.min(30, +$('#pd').value || 7)), order = TOPICS.slice().sort((a, b) => b.marks - a.marks || a.i - b.i), learn = days === 1 ? 1 : days - 1, per = Math.ceil(order.length / learn); let out = '';
        for (let d = 0; d < learn; d++) { const ts = order.slice(d * per, (d + 1) * per); if (!ts.length) break; out += '<div class="day"><b>Day ' + (d + 1) + '</b><div class="stack" style="gap:8px"><div class="chips">' + ts.map(tb).join('') + '</div><p class="hint">Read the story, watch it run, write the code once from memory, then take the quiz.</p></div></div>'; }
        if (days > 1) out += '<div class="day"><b>Day ' + days + '</b><div class="stack" style="gap:8px"><p>Revision day. Take a mock test, clear your Needs practice flashcards and read the cheat sheet.</p><div class="ctl"><button class="btn" type="button" data-open="mock">Mock test</button><button class="btn" type="button" data-open="cards">Flashcards</button></div></div></div>';
        $('#pout').innerHTML = out;
      };
      $('#pg').onclick = make; make();
    }
  };
  const show = t => { cleanup(); setTabsOn(t); body.scrollTop = 0; views[t](); };
  D.kitShow = show; show(tab || 'marks');
}

/* ----- events ----- */
function openGlobal(k) { if (k === 'cards') openCards(); else if (k === 'mock') openMock(); else if (k === 'kit') openKit(); }
function goZone(id) { const z = $('#z-' + id); if (z) z.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
document.addEventListener('click', e => {
  const t = e.target;
  const op = t.closest('[data-open]'); if (op) { openGlobal(op.dataset.open); return; }
  const tc = t.closest('.tc'); if (tc) { openTopic(+tc.dataset.t); return; }
  const z = t.closest('[data-zone]'); if (z) { goZone(z.dataset.zone); return; }
  if (t.closest('#goStart')) { if (S.last != null && TOPICS[S.last]) openTopic(S.last); else goZone('basics'); return; }
  if (t.closest('#brand')) { window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); return; }
  if (!dr.hidden) {
    if (t === dr || t.closest('#dx')) { closeDrawer(); return; }
    const tp = t.closest('[data-topic]'); if (tp) { openTopic(+tp.dataset.topic); return; }
    const tab = t.closest('#dtabs .tab');
    if (tab) { if (D.kind === 'topic') setTab(tab.dataset.tab); else if (D.kind === 'kit') D.kitShow(tab.dataset.tab); return; }
    if (D.kind === 'topic') {
      if (t.closest('#dprev')) { openTopic(D.i - 1, D.tab); return; }
      if (t.closest('#dnext')) { openTopic(D.i + 1, D.tab); return; }
      if (t.closest('#dm')) { const T = TOPICS[D.i]; S.done[T.i] = !S.done[T.i]; if (S.done[T.i] && !S.mx[T.i]) { S.mx[T.i] = 1; addXP(20); confetti(); } save(); footer(); return; }
      if (t.closest('#dnx')) { const k = TABS.findIndex(x => x[0] === D.tab); if (k < TABS.length - 1) setTab(TABS[k + 1][0]); else if (D.i < TOPICS.length - 1) openTopic(D.i + 1, 'story'); else closeDrawer(); return; }
    }
  }
});
document.addEventListener('keydown', e => {
  if (dr.hidden) return;
  if (e.key === 'Escape') { closeDrawer(); return; }
  const tg = e.target && e.target.tagName; if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') return;
  if (D.keys) D.keys(e);
});
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', () => { resize(); onScroll(); });

/* ----- boot ----- */
resize(); render(); hud();
if (!reduce) requestAnimationFrame(skyLoop);
})();
</script>
